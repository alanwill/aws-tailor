        Type: AWS::Serverless::Function
        Properties:
            FunctionName: !Join [ "-", [ "talr-accountupdate-metadata", !Ref stage ] ]
            Description: Update API for Tailor account metadata
            Runtime: python2.7
            CodeUri: ./sam/functions/talr-accountupdate-metadata
            Handler: handler.