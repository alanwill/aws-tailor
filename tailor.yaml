            Role:
                Fn::GetAtt:
                    - iamCoreFunctionsRolesStack
                    - Outputs.iamRoleArnLambdaTalrAccountUpdateVpcdns
            Environment:
                Variables:
                    TAILOR_TABLENAME_CBINFO:
                        Fn::GetAtt:
                            - dynamodbTablesStack
                            - Outputs.dynamodbTableNameTalrCbInfo
                    TAILOR_TABLENAME_ACCOUNTINFO:
                        Fn::GetAtt:
